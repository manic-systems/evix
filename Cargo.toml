[workspace]
default-members = [ "crates/evix-cli" ]
members         = [ "crates/*" ]
resolver        = "3"

[workspace.package]
edition      = "2024"
license      = "EUPL-1.2"
repository   = "https://github.com/manic-systems/evix"
rust-version = "1.95.0"
version      = "2.1.0"

[workspace.dependencies]
# Workspace components
evix          = { path = "crates/evix", version = "2.1.0" }
evix-daemon   = { path = "crates/evix-daemon", version = "2.1.0" }
evix-protocol = { path = "crates/evix-protocol", version = "2.1.0" }

# Other dependencies
anyhow = "1.0.104"
capnp = "0.27.2"
capnp-futures = "0.27.0"
capnpc = "0.27.0"
futures-channel = { version = "0.3.34", features = [ "sink" ] }
futures-core = "0.3.34"
futures-util = { version = "0.3.34", features = [ "sink" ] }
libc = "0.2.189"
misstep = { version = "0.2.0", features = [ "color", "pretty" ] }
nix-bindings = { version = "0.2352.0", features = [ "full" ] }
notify = "8.2.0"
pound = "0.1.8"
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
  "io-std",
  "io-util",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = { version = "0.7.19", features = [ "compat" ] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [ "env-filter" ] }

[profile.release]
codegen-units = 1
lto           = true
panic         = "abort"
strip         = "symbols"
