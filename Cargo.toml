[workspace]
default-members = [ "crates/evix-cli" ]
members         = [ "crates/*" ]
resolver        = "3"

[workspace.package]
edition      = "2024"
license      = "EUPL-1.2"
repository   = "https://github.com/manic-systems/evix"
rust-version = "1.95.0"
version      = "3.0.2"

[workspace.dependencies]
# Workspace components
evix          = { path = "crates/evix", version = "3.0.2" }
evix-daemon   = { path = "crates/evix-daemon", version = "3.0.2" }
evix-protocol = { path = "crates/evix-protocol", version = "3.0.2" }

# Other dependencies
capnp = "0.28.1"
capnp-futures = "0.28.0"
capnpc = "0.28.1"
futures-channel = { version = "0.3.34", features = [ "sink" ] }
futures-core = "0.3.34"
futures-util = { version = "0.3.34", features = [ "sink" ] }
libc = "0.2.191"
mimalloc-ng = { version = "0.2.1", default-features = false, features = [ "override" ] }
misstep = { version = "0.4.1", features = [ "color", "pretty" ] }
nix-bindings = { version = "0.2356.0", features = [ "full" ] }
notify = { version = "9.0.0", features = [ "tokio" ] }
pound = "0.6.1"
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
  "io-util",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = { version = "0.7.20", features = [ "compat" ] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [ "env-filter" ] }

[profile.release]
codegen-units = 1
lto           = "thin"
opt-level     = 3
panic         = "abort"
strip         = "symbols"
