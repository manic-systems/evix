name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    name: Checks (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, system: x86_64-linux }
          - { os: ubuntu-26.04-arm, system: aarch64-linux }
    permissions:
      actions: write
      contents: read
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      os: ${{ matrix.os }}
      flake-check-command: nix flake check --no-build
      build: true
      build-command: nix build .#packages.${{ matrix.system }}.default -L --no-link
      cache: true
      cache-save: true

  eval-vm:
    name: Eval VM Test
    needs: checks
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      flake-check: false
      build: true
      build-command: nix build .#checks.x86_64-linux.eval -L --no-link
      cache: true

  actions:
    name: Actions Lint
    uses: manic-systems/workflows/.github/workflows/actions-lint.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2

  required:
    name: Required Checks
    if: always()
    needs:
      - checks
      - eval-vm
      - actions
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
